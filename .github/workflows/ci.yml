name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      # eslint's and vitest's current releases need Node.js 20+. The package itself still supports
      # Node.js 18, which the typecheck, build and CLI steps keep covering.
      - name: Run lint
        if: matrix.node-version != 18
        run: npm run lint

      - name: Unit and tool tests
        if: matrix.node-version != 18
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build output
        run: test -f dist/index.d.ts && node dist/cli/index.js --help

      - name: Smoke test (MCP over stdio, no credentials)
        if: matrix.node-version != 18
        run: npm run test:smoke

      - name: Publish (dry run) without package.json corrections
        # npm silently drops invalid fields at publish (e.g. a bin path it rejects); fail instead.
        run: |
          npm publish --dry-run --access public 2>&1 | tee publish-dry-run.log
          if grep -qiE "errors corrected|was invalid and removed" publish-dry-run.log; then
            echo "::error::npm would change package.json at publish time; run 'npm pkg fix' and commit."
            exit 1
          fi
