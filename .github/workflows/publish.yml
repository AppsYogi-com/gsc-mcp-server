name: Publish to npm

# Publishes via npm trusted publishing (OIDC): no npm token is stored in GitHub.
# The trusted publisher on npmjs.com is stage-only, so this job stages the
# release; a maintainer then approves it with 2FA (npmjs.com or `npm stage approve`).

on:
  release:
    types: [published]
  workflow_dispatch: # Manual re-run, e.g. when a release's publish step failed

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Trusted publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        # Trusted publishing needs npm >= 11.5.1; `npm stage publish` needs a recent npm 11
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Stage publish to npm
        run: npm stage publish --access public --provenance
